name: Deploy Migrations to Production

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/deploy-migrations.yml"
  workflow_dispatch:

# Never let two deploys apply migrations to prod at the same time.
concurrency:
  group: deploy-migrations
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - run: supabase db push

      # PostgREST caches the schema and doesn't reliably pick up function
      # signature changes from `db push` right away — new/changed RPCs can
      # 404 against production for a while after a migration deploys without
      # this. NOTIFY is idempotent and safe to send even when nothing changed.
      - name: Reload PostgREST schema cache
        run: |
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql \
            "postgresql://postgres:${SUPABASE_DB_PASSWORD}@db.${SUPABASE_PROJECT_ID}.supabase.co:5432/postgres" \
            -c "NOTIFY pgrst, 'reload schema';"
